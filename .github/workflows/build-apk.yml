name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Checking Java version..."
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Unable to detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_VER) is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore found."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Debug keystore confirmed."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH not found."
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension."; exit 1 ;;
          esac
          echo "Verified APK: $APK_PATH ($(stat -c%s "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_RELEASE_DIR=$(mktemp -d)
          cp "app/build/outputs/apk/debug/app-debug.apk" "${TMP_RELEASE_DIR}/app-debug.apk"
          if [ ! -s "${TMP_RELEASE_DIR}/app-debug.apk" ]; then
            echo "ERROR: Failed to prepare ${TMP_RELEASE_DIR}/app-debug.apk"
            exit 1
          fi
          echo "asset_path=${TMP_RELEASE_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${TMP_RELEASE_DIR}/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          gh --version || { echo "ERROR: gh CLI is not available"; exit 1; }

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Asset file missing or empty: $ASSET_PATH"
            exit 1
          fi

          ASSET_FILENAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset filename must be app-debug.apk, got $ASSET_FILENAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### BeatWave Debug APK

          - **Type**: Automatically generated debug APK
          - **Built by**: GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Commit SHA**: ${GITHUB_SHA}
          - **Purpose**: Intended for testing only
          - **Notice**: This is NOT a Play Store production release. The APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            echo "GitHub Release created successfully."
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release Asset: app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "Direct download link for the latest debug APK:"
              echo "[$DIRECT_URL]($DIRECT_URL)"
              echo ""
              echo "> **Backup Artifact**: The Actions artifact \`app-debug-apk\` is also available as a backup under this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publication did not succeed or was skipped."
            echo "The APK build completed successfully and the Actions artifact 'app-debug-apk' remains available as a backup."
            {
              echo "## APK Build Status"
              echo ""
              echo "⚠️ The GitHub Release step encountered an issue, but the debug APK was built successfully."
              echo "The Actions artifact \`app-debug-apk\` is preserved and available for download from this run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
